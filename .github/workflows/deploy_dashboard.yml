name: Build and Deploy React (Vite) Dashboard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install Dependencies
        run: npm install --frozen-lockfile

      # 4️⃣ Build the Vite dashboard
      - name: Build Dashboard
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies (needed for npm run preview)
      - name: Install Dependencies
        run: npm install --frozen-lockfile

      # 4️⃣ Setup SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 5️⃣ Deploy to EC2 and run with PM2
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh $EC2_USER@$EC2_HOST "
            # Load NVM (if Node installed via NVM)
            export NVM_DIR=\"$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"

            # Install PM2 globally if missing
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2

            # Create deployment folder
            mkdir -p ~/uogi_dashboard

            # Sync the built dist folder
            rsync -avz --delete $GITHUB_WORKSPACE/dist/ ~/uogi_dashboard/

            # Stop existing PM2 process if running
            pm2 describe dashboard >/dev/null 2>&1 && pm2 reload dashboard || pm2 start npm --name 'dashboard' -- run preview

            # Save PM2 process list
            pm2 save
          "