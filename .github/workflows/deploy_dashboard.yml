name: Build and Deploy React Dashboard

on:
  push:
    branches:
    - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest


    steps:
          - name: Checkout Code
            uses: actions/checkout@v4

          - name: Setup Node
            uses: actions/setup-node@v4
            with:
              node-version: 20

          - name: Install Dependencies
            run: npm install

          - name: Build Project
            run: npm run build

          - name: Deploy to Server
            uses: appleboy/scp-action@v0.1.7
            with:
              host: ${{ secrets.SERVER_HOST }}
              username: ${{ secrets.SERVER_USER }}
              key: ${{ secrets.SERVER_SSH_KEY }}
              source: "dist"
              target: "/var/www/uogi_dashboard"

          - name: Restart App with PM2
            uses: appleboy/ssh-action@v1.0.3
            with:
              host: ${{ secrets.SERVER_HOST }}
              username: ${{ secrets.SERVER_USER }}
              key: ${{ secrets.SERVER_SSH_KEY }}
              script: |
                cd /var/www/uogi_dashboard
                pm2 delete dashboard || true
                pm2 start "serve -s dist -l 3001" --name dashboard
                pm2 save

