name: Build and Deploy React (Vite) Dashboard

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node JS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Node version
        run: node -v

      - name: Install Dependencies
        run: npm install --frozen-lockfile

      - name: Build Dashboard
        run: npm run build

      - name: Check build folder
        run: ls -la dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Node JS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --frozen-lockfile

      - name: Build Dashboard
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # deployment folder তৈরি করো
          ssh $EC2_USER@$EC2_HOST "mkdir -p ~/uogi_dashboard"

          # dist/ + package.json copy করো
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            dist/ $EC2_USER@$EC2_HOST:~/uogi_dashboard/dist/

          rsync -avz package.json $EC2_USER@$EC2_HOST:~/uogi_dashboard/

          # node_modules install + pm2 start
          ssh $EC2_USER@$EC2_HOST 'export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && cd ~/uogi_dashboard && npm install --frozen-lockfile'

          # pm2 reload অথবা নতুন start
          ssh $EC2_USER@$EC2_HOST 'export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && cd ~/uogi_dashboard && pm2 describe dashboard > /dev/null 2>&1 && pm2 reload dashboard || pm2 start npm --name "dashboard" -- run preview'

          # pm2 save
          ssh $EC2_USER@$EC2_HOST 'export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && pm2 save'