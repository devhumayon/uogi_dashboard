name: Build and Deploy React (Vite) Dashboard

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Dashboard
        run: npm run build

      - name: Check build folder
        run: ls -la dist/

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # dist/ এখন এই same job-এ আছে, তাই rsync কাজ করবে
          rsync -avz --delete dist/ $EC2_USER@$EC2_HOST:~/uogi_dashboard/

          # EC2-তে pm2 setup করো
          ssh $EC2_USER@$EC2_HOST "
            # pm2 না থাকলে install করো
            command -v pm2 || npm install -g pm2

            cd ~/uogi_dashboard

            # serve package দিয়ে static files serve করো
            npm install -g serve 2>/dev/null || true

            # pm2 reload অথবা নতুন start
            pm2 describe dashboard > /dev/null 2>&1 \
              && pm2 reload dashboard \
              || pm2 start serve --name 'dashboard' -- -s /home/$USER/uogi_dashboard -l 3000

            pm2 save
            pm2 startup | tail -1 | bash || true
          "