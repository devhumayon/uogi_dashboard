name: Build and Deploy React (Vite) Dashboard

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Install Dependencies
        run: npm install --frozen-lockfile

      - name: Build Dashboard
        run: npm run build

      - name: Check build folder
        run: ls -la dist/

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # package.json + dist/ দুটোই copy করো
          rsync -avz --delete dist/ $EC2_USER@$EC2_HOST:~/uogi_dashboard/dist/
          rsync -avz package.json $EC2_USER@$EC2_HOST:~/uogi_dashboard/

          ssh $EC2_USER@$EC2_HOST bash << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin

            command -v npm || { echo "ERROR: npm not found. Install Node.js on EC2 first!"; exit 1; }

            cd ~/uogi_dashboard

            # node_modules না থাকলে install করো
            [ -d "node_modules" ] || npm install

            command -v pm2 || npm install -g pm2

            # pm2 reload অথবা নতুন start
            if pm2 describe dashboard > /dev/null 2>&1; then
              pm2 reload dashboard
            else
              pm2 start npm --name 'dashboard' -- run preview
            fi

            pm2 save
          EOF